<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>안녕! 나는 김태양이야</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #fdfbfb 0%, #f3f0ff 50%, #e8f4ff 100%);
      --card-bg: rgba(255, 255, 255, 0.88);
      --card-border: rgba(255, 255, 255, 0.9);
      --text-main: #18181b;
      --text-sub: #52525b;
      --accent-gradient: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
      --pill-bg: #f4f4f5;
      --shadow-soft: 0 10px 30px -10px rgba(24, 24, 27, 0.08);
      --shadow-hover: 0 16px 36px -12px rgba(99, 102, 241, 0.18);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      line-height: 1.6;
      min-height: 100vh;
      padding: 32px 16px 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 680px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    hr {
      display: none;
    }

    /* 상단 SNS 프로필 헤더 */
    header {
      background: var(--card-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: var(--shadow-soft);
    }

    header h1 {
      font-size: 1.65rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 8px;
    }

    header p {
      color: var(--text-sub);
      font-size: 1rem;
    }

    /* 메인 벤토 그리드 */
    main {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    section {
      background: var(--card-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 24px;
      box-shadow: var(--shadow-soft);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    section:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-hover);
    }

    section h2 {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-sub);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* 사진 카드 (스토리 링 스타일) */
    .photo-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .photo-card h2 {
      align-self: flex-start;
    }

    figure {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      width: 100%;
    }

    .avatar-ring {
      padding: 4px;
      border-radius: 50%;
      background: var(--accent-gradient);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 20px rgba(220, 39, 67, 0.2);
    }

    img {
      width: 168px;
      height: 168px;
      border-radius: 50%;
      object-fit: cover;
      background-color: #f4f4f5;
      border: 4px solid #ffffff;
      display: block;
      font-size: 0.85rem;
      color: var(--text-sub);
      text-align: center;
    }

    figcaption {
      font-size: 0.85rem;
      color: var(--text-sub);
      background: var(--pill-bg);
      padding: 6px 14px;
      border-radius: 999px;
    }

    /* 기본 정보 카드 */
    .info-card ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .info-card li {
      background: var(--pill-bg);
      padding: 14px 16px;
      border-radius: 16px;
      font-size: 0.98rem;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .info-card li strong {
      font-size: 0.8rem;
      color: var(--text-sub);
      font-weight: 600;
    }

    /* 좋아하는 것 3가지 (전체 너비 벤토 카드) */
    .favorites-card {
      grid-column: 1 / -1;
    }

    .favorites-card ol {
      list-style: none;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .favorites-card li {
      background: #ffffff;
      border: 1px solid #f0f0f3;
      border-radius: 20px;
      padding: 18px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .favorites-card li:hover {
      transform: translateY(-2px);
      border-color: #d4d4ff;
    }

    .favorites-card li strong {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .favorites-card li p {
      font-size: 0.9rem;
      color: var(--text-sub);
      line-height: 1.5;
    }

    /* 하단 푸터 */
    footer {
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      color: #ffffff;
      border-radius: 24px;
      padding: 20px 24px;
      text-align: center;
      font-weight: 600;
      font-size: 0.98rem;
      box-shadow: 0 10px 25px -8px rgba(99, 102, 241, 0.45);
    }

    /* 모바일 반응형 (스마트폰 화면) */
    @media (max-width: 600px) {
      body {
        padding: 20px 14px 36px;
      }

      header {
        padding: 24px 18px;
        border-radius: 24px;
      }

      header h1 {
        font-size: 1.38rem;
      }

      main {
        grid-template-columns: 1fr;
        gap: 14px;
      }

      section {
        padding: 20px 18px;
        border-radius: 22px;
      }

      img {
        width: 144px;
        height: 144px;
      }

      .favorites-card ol {
        grid-template-columns: 1fr;
      }

      footer {
        font-size: 0.92rem;
        padding: 18px 16px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>안녕, 친구들! 나는 김태양이야 👋</h1>
      <p>나를 소개하는 페이지에 온 걸 환영해!</p>
      <hr>
    </header>

    <main>
      <section class="photo-card">
        <h2>내 사진</h2>
        <figure>
          <div class="avatar-ring">
            <img src="profile.jpg" alt="김태양의 프로필 사진" width="240" height="240">
          </div>
          <figcaption>여기에 내 사진(profile.jpg)이 들어갈 자리야!</figcaption>
        </figure>
      </section>

      <hr>

      <section class="info-card">
        <h2>기본 정보</h2>
        <ul>
          <li><strong>이름:</strong> 김태양</li>
          <li><strong>MBTI:</strong> ESFJ (사교적인 외교관)</li>
        </ul>
      </section>

      <hr>

      <section class="favorites-card">
        <h2>내가 좋아하는 것 3가지</h2>
        <ol>
          <li>
            <strong>축구 ⚽</strong>
            <p>친구들과 같이 공 차고 땀 흘리는 게 최고야!</p>
          </li>
          <li>
            <strong>볼링 🎳</strong>
            <p>스트라이크 칠 때의 짜릿한 기분을 좋아해.</p>
          </li>
          <li>
            <strong>개발하기 💻</strong>
            <p>코드를 작성해서 직접 무언가를 만들어 내는 게 재밌어.</p>
          </li>
        </ol>
      </section>
    </main>

    <hr>

    <footer>
      <p>앞으로도 잘 지내자, 친구들! 언제든 같이 축구랑 볼링 치러 가자 😊</p>
    </footer>
  </div>
</body>
</html>
